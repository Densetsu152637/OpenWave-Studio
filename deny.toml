# cargo-deny policy. Official binaries stay MIT-compatible: only the licenses listed here are
# accepted, so GPL, LGPL and AGPL dependencies (including `GPL-3.0-only`) are rejected. An
# `OR` expression passes when at least one alternative is allowed.
[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "Unlicense",
  "CC0-1.0",
]

[graph]
# Check every platform's dependency graph, not only the host's.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]
