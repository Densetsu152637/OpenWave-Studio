name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, experimental]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      web: ${{ steps.detect.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: detect
        run: bash scripts/ci/detect.sh

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"
      # Offline, with nothing to download: GitHub's release downloads were failing on runners.
      - name: Check relative links
        run: python3 scripts/ci/check-links.py .

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

  rust:
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: bash scripts/ci/install-linux-deps.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: pnpm install --frozen-lockfile
      # The app crate embeds the built frontend, so it must exist before fmt/clippy/test.
      - run: pnpm build
      - run: bash scripts/check-rust.sh
      # Device stage 9: the source-build-only ASIO feature must keep compiling. Build only, never
      # published. cpal's build script downloads the SDK; bindgen needs the runner's LLVM.
      - name: Build ow-io with ASIO (build only)
        if: runner.os == 'Windows'
        timeout-minutes: 20
        env:
          LIBCLANG_PATH: 'C:/Program Files/LLVM/bin'
        run: cargo build -p ow-io --features asio --locked
      # Engine stage 6: the RT-safety suite again with eight DSP workers (allocation guard on
      # every worker and the callback thread).
      - name: RT safety with 8 DSP workers
        timeout-minutes: 15
        run: OW_TEST_WORKERS=8 cargo test -p ow-engine --locked --test rt_safety
      # The workspace run covers this test too; this step shows its join or skip reason.
      - name: macOS audio workgroup join
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: cargo test -p ow-engine --locked --lib workgroup -- --nocapture
      # IPC stage 10: the generated TypeScript types and the stream fixture the UI tests replay
      # must be current (Linux only: Windows checkouts convert line endings).
      - name: IPC bindings are current
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          cargo test -p ow-ipc --locked export_bindings
          git diff --exit-code src/lib/ipc/generated src/lib/stores/fixtures
          # New files (an uncommitted generated type) do not show in `git diff`.
          test -z "$(git status --porcelain -- src/lib/ipc/generated src/lib/stores/fixtures)"
      # IPC stage 10: sampling and packing 128 meters plus the transport, median under 100 us.
      - name: Telemetry budget (release)
        timeout-minutes: 10
        run: cargo test -p ow-ipc --locked --release telemetry_budget
      # Recording stage 14: 16 input tracks for ten simulated minutes with every writer thread
      # running; no ring may overrun. It writes about 1.8 GB of WAV, so Linux only.
      - name: Sustained recording (release)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: cargo test -p ow-engine --locked --release --test record_loopback sustained
      # Track-count benchmark: tracked for trends, timings are not gated.
      - name: Track-count benchmark
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: cargo bench -p ow-engine --locked --bench tracks -- --quick

  # Licenses of every platform's dependency graph (deny.toml): GPL, LGPL and AGPL are rejected.
  deny:
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check licenses

  web:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/check-web.sh

  # Work lands on experimental; main only takes experimental, once it has been released there.
  source:
    name: source branch
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Only experimental merges into main
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$BASE" = main ] && { [ "$HEAD" != experimental ] || [ "$HEAD_REPO" != "$REPO" ]; }; then
            echo "::error::Pull requests into main must come from experimental. Target experimental instead."
            exit 1
          fi

  gate:
    name: CI gate
    if: always()
    needs: [detect, docs, workflows, rust, deny, web, source]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any check failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All required checks passed or were not applicable."
