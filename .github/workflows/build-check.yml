# Stage 1 build check: fmt, clippy, tests and an unbundled release build on all three OSes,
# plus the headless `--version` smoke test. Stage 2 replaces this with ci.yml.
name: Build check

on:
  pull_request:
  push:
    branches: [main, experimental]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/check-web.sh

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: bash scripts/ci/install-linux-deps.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: pnpm install --frozen-lockfile
      # The app crate embeds the built frontend, so it must exist before fmt/clippy/test.
      - run: pnpm build
      - run: bash scripts/check-rust.sh
      - name: Set the build version
        run: echo "OW_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_ENV"
      - name: Build (no bundle)
        run: pnpm tauri build --no-bundle
      - name: Headless --version
        timeout-minutes: 2
        run: |
          exe=target/release/openwave-studio
          if [ "$RUNNER_OS" = Windows ]; then exe="$exe.exe"; fi
          expected="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          actual="$("$exe" --version)"
          echo "expected=[$expected] actual=[$actual]"
          test "$actual" = "$expected"
