name: Build

on:
  workflow_call:
    inputs:
      channel:
        description: stable, prerelease, or experimental
        type: string
        required: true
      version:
        description: Semantic version stamped into the bundles
        type: string
        required: true

permissions:
  contents: read

jobs:
  bundle:
    name: bundle (${{ matrix.id }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            runner: ubuntu-22.04
            rust_targets: x86_64-unknown-linux-gnu
            tauri_target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          - id: linux-arm64
            runner: ubuntu-22.04-arm
            rust_targets: aarch64-unknown-linux-gnu
            tauri_target: aarch64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          - id: windows-x64
            runner: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            tauri_target: x86_64-pc-windows-msvc
            bundles: nsis
          - id: windows-arm64
            runner: windows-11-arm
            rust_targets: aarch64-pc-windows-msvc
            tauri_target: aarch64-pc-windows-msvc
            bundles: nsis
          - id: macos-universal
            runner: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_target: universal-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}
      - if: runner.os == 'Linux'
        run: bash scripts/ci/install-linux-deps.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.id }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Developer ID signing and notarization run only when the APPLE_* secrets exist. Tauri treats
      # an empty variable as configured, so only non-empty ones reach the build. Without them the
      # macOS bundle is ad-hoc signed (bundle.macOS.signingIdentity "-").
      - name: Signing environment
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!var:-}" ]; then printf '%s=%s\n' "$var" "${!var}" >> "$GITHUB_ENV"; fi
          done
      - id: prepare
        name: Prepare build
        env:
          VERSION: ${{ inputs.version }}
          TAURI_TARGET: ${{ matrix.tauri_target }}
          BUNDLES: ${{ matrix.bundles }}
        run: bash scripts/ci/prepare-build.sh "$TAURI_TARGET" "$BUNDLES" "$VERSION"
      # Build-only mode: no tagName or releaseId, so tauri-action uploads nothing. The release is
      # created by the publish job from release-dist/.
      - id: tauri
        name: Build desktop bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          # The app prints this for `--version`; it matches the channel version set in --config.
          OW_VERSION: ${{ inputs.version }}
        with:
          tauriScript: pnpm tauri
          args: ${{ steps.prepare.outputs.args }}
      - name: Launch smoke test
        env:
          ID: ${{ matrix.id }}
          TAURI_TARGET: ${{ matrix.tauri_target }}
          VERSION: ${{ inputs.version }}
        run: bash scripts/ci/smoke.sh "$ID" "$TAURI_TARGET" "$VERSION"
      - name: Collect release files
        env:
          ID: ${{ matrix.id }}
          TAURI_TARGET: ${{ matrix.tauri_target }}
          VERSION: ${{ inputs.version }}
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          UPDATER: ${{ steps.prepare.outputs.updater }}
        run: bash scripts/ci/collect-dist.sh "$ID" "$TAURI_TARGET" "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openwave-${{ inputs.channel }}-${{ matrix.id }}
          path: release-dist/
          if-no-files-found: error
          retention-days: 14
