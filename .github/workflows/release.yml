name: Release

on:
  push:
    tags: ["v*", "!v*-experimental*"]
  workflow_dispatch:
    inputs:
      force_feed:
        description: Skip the newer-feed-wins check for this run (intentional version reset; dispatch on a tag ref)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      prerelease: ${{ steps.prepare.outputs.prerelease }}
    steps:
      # Full history, so the ancestry check can see origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: prepare
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != tag ]; then
            echo "::error::Releases are built from a version tag, not from ${GITHUB_REF}."
            exit 1
          fi
          bash scripts/ci/release-prepare.sh "$GITHUB_REF_NAME"

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      channel: ${{ needs.prepare.outputs.prerelease == 'true' && 'prerelease' || 'stable' }}
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: openwave-*
          path: release-dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          FORCE_FEED: ${{ inputs.force_feed }}
        run: bash scripts/ci/publish-release.sh "$GITHUB_REF_NAME" "$PRERELEASE"
