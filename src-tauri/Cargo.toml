[package]
name = "openwave-studio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "OpenWave Studio: a free, open source, portable DAW"
default-run = "openwave-studio"

[lib]
name = "openwave_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
ow-engine = { path = "../crates/ow-engine" }
ow-io = { path = "../crates/ow-io" }
ow-ipc = { path = "../crates/ow-ipc" }
ow-mcp = { path = "../crates/ow-mcp" }
ow-media = { path = "../crates/ow-media" }
ow-model = { path = "../crates/ow-model" }
ow-plugin-host = { path = "../crates/ow-plugin-host" }
tauri-plugin-updater = "2"
semver = "1"
tokio = { version = "1", features = ["time", "sync", "io-util", "net", "rt"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
hound = "3.5.1"
# The temporary media folder of a project that was never saved.
tempfile = "3"
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
strum = "0.28.0"
# The plugin_state tests call the test hooks the fixture plugins export.
libloading = "0.8"
# Depending on the fixtures builds the plugin bundles the plugin_state test loads.
ow-plugin-fixtures = { path = "../crates/ow-plugin-fixtures" }

[lints]
workspace = true
