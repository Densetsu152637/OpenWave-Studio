[package]
name = "ow-model"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Project model for OpenWave Studio: timeline math, tracks, clips, edit commands"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
# Generates the UI's TypeScript types (optional, see the `ts` feature).
ts-rs = { version = "12.0.1", optional = true, features = ["no-serde-warnings"] }
# `.owz` archives (project sharing and templates); deflate only, no encryption or other codecs.
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[features]
# TypeScript bindings (ts-rs derives only; serialization is unchanged). Enabled by `ow-ipc`.
ts = ["dep:ts-rs"]

[dev-dependencies]
proptest = { version = "1.9.0", default-features = false, features = ["std"] }
tempfile = "3.27.0"

[lints]
workspace = true
