[package]
name = "ow-dsp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Built-in instruments and effects for OpenWave Studio: plain DSP with no application types"

# Only DSP libraries, never OpenWave crates: stage 27 exports these devices as plugins, so
# nothing here may know about the model, the engine or the UI.
[dependencies]

[build-dependencies]
# Compiles the vendored Signalsmith Stretch (MIT, `vendor/signalsmith-stretch`); needs a C++
# compiler on the build machine.
cc = "1"

[dev-dependencies]
assert_no_alloc = { version = "1.1.2" }

[lints]
workspace = true
