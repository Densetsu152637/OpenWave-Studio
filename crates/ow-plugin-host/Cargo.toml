[package]
name = "ow-plugin-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Third-party plugin hosting for OpenWave Studio: CLAP and VST3, the out-of-process scanner, parameters, state and editor windows"

[dependencies]
assert_no_alloc = { version = "1.1.2", features = ["disable_release"] }
base64 = "0.22"
clack-host = "=0.2.0"
clack-extensions = { version = "=0.2.0", features = ["clack-host", "audio-ports", "note-ports", "params", "state", "latency", "thread-check", "log", "gui"] }
libloading = "0.8"
ow-dsp = { path = "../ow-dsp" }
rtrb = "0.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vst3 = "0.3"

# Editor windows are plain platform windows that OpenWave creates itself (architecture section 8).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"

[dev-dependencies]
# Depending on the fixtures builds the plugin bundles, so a fresh checkout passes the tests.
ow-plugin-fixtures = { path = "../ow-plugin-fixtures" }
# Dev-dependency cycle (ow-engine depends on this crate): the engine tests compile real projects
# with hosted plugins.
ow-engine = { path = "../ow-engine" }
ow-model = { path = "../ow-model" }
assert_no_alloc = { version = "1.1.2" }
libloading = "0.8"
tempfile = "3.27.0"

[lints]
workspace = true

# Editor windows need the process's main thread (AppKit), so this test has its own `main`.
[[test]]
name = "editor"
harness = false
