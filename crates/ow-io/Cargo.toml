[package]
name = "ow-io"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Audio and MIDI device backends for OpenWave Studio"

[features]
# ASIO is source-build-only (GPLv3 obligations); official binaries never enable it.
asio = ["cpal/asio"]
# JACK hosts through cpal (Linux and macOS); off by default so CI needs no JACK headers.
jack = ["cpal/jack"]
# PipeWire host through cpal (Linux); off by default so CI needs no libpipewire headers.
pipewire = ["cpal/pipewire"]

[dependencies]
cpal = "0.18"
midir = "0.11"
rtrb = "0.4.1"

# WASAPI exclusive mode (cpal's WASAPI host is shared-mode only).
[target.'cfg(windows)'.dependencies]
wasapi = "0.27"
# MMCSS real-time priority for the exclusive-mode render thread (as in ow-engine).
audio_thread_priority = { version = "0.38.0", default-features = false }

[dev-dependencies]
assert_no_alloc = { version = "1.1.2", features = ["disable_release"] }
# Dev-dependency cycle (ow-engine depends on ow-io): the mock tests drive a real engine plan.
ow-engine = { path = "../ow-engine" }

[lints]
workspace = true
