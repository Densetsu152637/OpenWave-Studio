[workspace]
resolver = "3"
# Cargo errors on explicit member paths that do not exist, so list only what exists. The stages
# that create `plugins/ow-plugins` or `xtask` append them here explicitly.
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Densetsu152637/OpenWave-Studio"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
