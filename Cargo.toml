[workspace]
resolver = "3"
# Cargo errors on explicit member paths that do not exist and on globs that match nothing, so
# the members later stages create (`plugins/ow-plugins`, `xtask`) cannot be listed by name yet.
# Both patterns match something today and keep matching as the tree grows:
#   `*/ow-*`      crates/ow-*, plugins/ow-*
#   `[sx]*[ik]`   src-tauri (the app crate) and xtask
# Stage 1 owns this file; later stages add crates without editing it.
members = ["*/ow-*", "[sx]*[ik]"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Densetsu152637/OpenWave-Studio"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
